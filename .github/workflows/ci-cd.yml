name: CI/CD

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A deleted push can run at the default branch SHA. Keep it out of deployment queues.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.deleted && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: Validation
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install Dependencies
        id: dependencies
        run: npm ci

      - name: Check Formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

  build:
    name: Build
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch-preview: ${{ steps.preview.outputs.enabled }}
    env:
      CLOUDFLARE_PREVIEW_BUILD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id) && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Select Branch Preview Build
        id: preview
        if: github.repository == 'FOSSBilling/auth' && github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';

          const slug = process.env.GITHUB_REF_NAME.normalize('NFKD').replace(/\p{Mark}/gu, '').toLowerCase()
            .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
          const enabled = slug !== 'staging' && !/^pr-\d+$/.test(slug);
          appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_PREVIEW_BUILD=${enabled}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          JS

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build && npx cf build

      - name: Validate Preview Build Output
        if: env.CLOUDFLARE_PREVIEW_BUILD == 'true'
        run: jq -e '.buildContext.isPreview == true and .buildContext.mode == "production"' .cloudflare/output/v1/config.json

      - name: Validate Worker Deployment
        if: env.CLOUDFLARE_PREVIEW_BUILD == 'false'
        run: npx cf deploy --prebuilt --dry-run --mode production

      - name: Upload Worker Build
        if: >-
          github.repository == 'FOSSBilling/auth' &&
          ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || steps.preview.outputs.enabled == 'true')) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id != github.event.repository.id))
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && format('fork-preview-{0}', github.run_attempt) || 'worker-build' }}
          overwrite: true
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 1 }}

  preview:
    name: Cloudflare Preview
    needs: [validation, build]
    if: ${{ !cancelled() && needs.build.outputs.branch-preview == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@24344bcecff7984a243f6147b4512a374835e9ee # main
    with:
      operation: deploy
      mode: preview
      node-version: "26"
      prebuilt: true
      build-result: ${{ needs.build.result }}
      checks-result: ${{ needs.validation.result }}
      pr-comment: true
      pr-base-branch: main
      environment: preview
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  staging:
    name: Deploy Staging Auth
    needs: [validation, build]
    if: github.repository == 'FOSSBilling/auth' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      deployment: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm

      - name: Install Dependencies and Build
        env:
          CLOUDFLARE_PREVIEW_BUILD: 'true'
        run: npm ci && npm run build && npx cf build --mode production

      - name: Verify Main Head
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Apply Staging Migrations and Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run db:migrate:preview
          npm run cf-preview -- --prebuilt --preview-name staging --mode production

      - name: Check Staging Auth
        shell: bash
        run: |
          url=https://staging.auth.fossbilling.foo
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors "$url/.well-known/openid-configuration" |
            jq -e --arg issuer "$url" '.issuer == $issuer'

  deploy:
    name: Deploy Production
    needs: [validation, build]
    if: github.repository == 'FOSSBilling/auth' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@24344bcecff7984a243f6147b4512a374835e9ee # main
    with:
      operation: deploy
      mode: production
      node-version: "26"
      prebuilt: true
      environment: production
      artifact-name: worker-build
      artifact-path: .cloudflare/output/
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
